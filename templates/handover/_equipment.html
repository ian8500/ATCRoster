<section class="handover-equipment" aria-labelledby="equipment-title"><header><div><span class="admin-step">Serviceability</span><h2 id="equipment-title">Equipment</h2></div></header><div>{% for item in equipment %}<article><i class="handover-status handover-status--{{ item.status }}" aria-label="{{ item.status }}"></i><span><strong>{{ item.name }}</strong><small>{{ item.note or ('Serviceable' if item.status == 'green' else 'No detail entered') }}</small></span></article>{% else %}<div class="handover-empty">No equipment has been configured.</div>{% endfor %}</div></section>
