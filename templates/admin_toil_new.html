{% extends "base.html" %}
{% block title %}Adjust TOIL{% endblock %}
{% block content %}
{% include "_admin_nav.html" %}
<section class="admin-function-heading">
  <div>
    <span class="admin-step">People · time off in lieu</span>
    <h2>Adjust a TOIL balance</h2>
    <p>Record a manual correction or an award that is not already created by a roster annotation.</p>
  </div>
</section>
<form method="post" class="card card-body admin-form-grid">
  <input type="hidden" name="_csrf_token" value="{{ csrf_token() }}">
  <input type="hidden" name="transaction_key" value="{{ transaction_key }}">
  <label>Who is the adjustment for?
  <select name="staff_id" required>
    {% for s in atcos %}
      <option value="{{ s.id }}">{{ s.name }} ({{ s.staff_no }}) — current balance: {{ (s.toil_half_days or 0)/2 }} days</option>
    {% endfor %}
  </select>
  </label>
  <label>What should happen?
    <select name="direction"><option value="add">Add to balance</option><option value="subtract">Deduct from balance</option></select>
  </label>
  <label>Amount
  <input type="number" name="amount" step="0.25" min="0.25" required>
  </label>
  <label>Measured in
  <select name="unit">
    <option value="days">Days</option>
    <option value="hours">Hours</option>
  </select>
  </label>
  <label>Reason or reference
  <input type="text" name="note" required maxlength="500" placeholder="Why is this adjustment being made?">
  </label>
  <div class="form-actions"><button type="submit" class="btn btn-primary">Record TOIL adjustment</button></div>
</form>
{% endblock %}
