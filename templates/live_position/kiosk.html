<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Live positions · {{ unit.name }}</title>
  <link rel="manifest" href="{{ url_for('static', filename='manifest.webmanifest') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
</head>
<body class="live-position-kiosk">
  <section id="live-position-kiosk-launch" class="live-position-kiosk-launch" role="dialog" aria-modal="true" aria-labelledby="live-position-kiosk-launch-title">
    <div>
      <p>Live Position Monitoring</p>
      <h1 id="live-position-kiosk-launch-title">Start kiosk display</h1>
      <span>This opens the monitor full screen and hides the browser controls.</span>
      <button class="btn" type="button" id="live-position-kiosk-start">Start kiosk</button>
      <small id="live-position-kiosk-launch-error" role="alert" hidden></small>
    </div>
  </section>
  <header class="live-position-kiosk__header">
    <div><p>Live Position Monitoring</p><h1>{{ unit.name }}</h1></div>
    <div class="live-position-kiosk__clock">
      <strong id="live-position-clock">--:--:--</strong>
      <span>UTC</span>
    </div>
    <div class="live-position-kiosk__connection" id="live-position-connection">
      <span aria-hidden="true">●</span> Connecting
    </div>
  </header>
  <main>
    <div id="live-position-warning" class="live-position-kiosk__warning" hidden></div>
    <div id="live-position-board-viewport" class="live-position-board-viewport">
      <section id="live-position-grid" class="live-position-groups" aria-live="polite"></section>
    </div>
  </main>
  <dialog id="live-position-dialog" class="live-position-dialog">
    <form id="live-position-action-form">
      <input type="hidden" id="live-position-id">
      <input type="hidden" id="live-position-operation">
      <input type="hidden" id="live-position-participant-id">
      <header>
        <h2 id="live-position-dialog-title">Position action</h2>
        <button type="button" class="btn btn-secondary" data-dialog-close>Cancel</button>
      </header>
      <p id="live-position-dialog-help">Confirm the operational change.</p>
      <label id="live-position-person-wrap">Primary controller
        <select id="live-position-person" required></select>
      </label>
      <label id="live-position-support-role-wrap">Secondary role
        <select id="live-position-support-role">
          <option value="">No secondary controller</option>
          <option value="ojti">OJTI</option>
          <option value="assessor">Assessor</option>
        </select>
      </label>
      <label id="live-position-support-person-wrap">Secondary controller
        <select id="live-position-support-person"></select>
      </label>
      <p id="live-position-action-error" class="live-position-dialog__error" role="alert" hidden></p>
      <button class="btn" type="submit" id="live-position-confirm">Confirm</button>
    </form>
  </dialog>
  <dialog id="live-position-logoff-dialog" class="live-position-dialog">
    <header>
      <h2>Choose who to log off</h2>
      <button type="button" class="btn btn-secondary" data-logoff-dialog-close>Cancel</button>
    </header>
    <p id="live-position-logoff-help"></p>
    <div id="live-position-logoff-options" class="live-position-logoff-options"></div>
    <p id="live-position-logoff-error" class="live-position-dialog__error" role="alert" hidden></p>
  </dialog>
  <footer class="live-position-kiosk__footer">
    <span id="live-position-refresh">Awaiting server data</span>
    <form method="post" action="{{ url_for('logout') }}">
      <input type="hidden" name="_csrf_token" value="{{ csrf_token() }}">
      <button class="btn btn-secondary" type="submit">Log out</button>
    </form>
  </footer>
  <script nonce="{{ csp_nonce() }}">
  (() => {
    const grid = document.getElementById('live-position-grid');
    const boardViewport = document.getElementById('live-position-board-viewport');
    const warning = document.getElementById('live-position-warning');
    const connection = document.getElementById('live-position-connection');
    const refreshed = document.getElementById('live-position-refresh');
    const clock = document.getElementById('live-position-clock');
    const dialog = document.getElementById('live-position-dialog');
    const logoffDialog = document.getElementById('live-position-logoff-dialog');
    const logoffOptions = document.getElementById('live-position-logoff-options');
    const logoffError = document.getElementById('live-position-logoff-error');
    const form = document.getElementById('live-position-action-form');
    const kioskLaunch = document.getElementById('live-position-kiosk-launch');
    const kioskStart = document.getElementById('live-position-kiosk-start');
    const kioskLaunchError = document.getElementById('live-position-kiosk-launch-error');
    const csrf = {{ csrf_token()|tojson }};
    let people = [];
    let livePositions = new Map();
    let serverOffset = 0;
    const isStandalone = () => window.matchMedia('(display-mode: fullscreen), (display-mode: standalone)').matches || window.navigator.standalone === true;
    const fullscreenElement = () => document.fullscreenElement || document.webkitFullscreenElement;
    const updateKioskLaunch = () => {
      kioskLaunch.hidden = Boolean(fullscreenElement()) || isStandalone();
    };
    const startKiosk = async () => {
      const root = document.documentElement;
      const enterFullscreen = root.requestFullscreen || root.webkitRequestFullscreen;
      kioskLaunchError.hidden = true;
      if (!enterFullscreen) {
        kioskLaunchError.textContent = 'This browser cannot hide its controls automatically. Install the app or use the browser kiosk/full-screen command.';
        kioskLaunchError.hidden = false;
        return;
      }
      try {
        try {
          await enterFullscreen.call(root, {navigationUI: 'hide'});
        } catch (_optionsError) {
          await enterFullscreen.call(root);
        }
      } catch (_error) {
        kioskLaunchError.textContent = 'Full screen was blocked. Select Start kiosk again or allow full-screen access for this site.';
        kioskLaunchError.hidden = false;
      }
      updateKioskLaunch();
    };
    kioskStart.addEventListener('click', startKiosk);
    document.addEventListener('fullscreenchange', updateKioskLaunch);
    document.addEventListener('webkitfullscreenchange', updateKioskLaunch);
    updateKioskLaunch();
    let fitFrame = 0;
    const fitBoard = () => {
      cancelAnimationFrame(fitFrame);
      fitFrame = requestAnimationFrame(() => {
        grid.style.transform = 'none';
        const scale = Math.min(
          1,
          boardViewport.clientWidth / Math.max(1, grid.scrollWidth),
          boardViewport.clientHeight / Math.max(1, grid.scrollHeight),
        );
        grid.style.transform = `scale(${scale})`;
        grid.dataset.scale = scale.toFixed(3);
      });
    };
    window.addEventListener('resize', fitBoard);
    window.addEventListener('orientationchange', fitBoard);
    document.addEventListener('fullscreenchange', fitBoard);
    document.addEventListener('webkitfullscreenchange', fitBoard);
    if (window.ResizeObserver) new ResizeObserver(fitBoard).observe(boardViewport);
    const escapeText = (value) => String(value ?? '').replace(/[&<>"']/g, (c) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    const render = (payload) => {
      warning.hidden = true;
      livePositions = new Map(payload.positions.map((position) => [position.id, position]));
      const serverTime = Date.parse(payload.server_time);
      if (Number.isFinite(serverTime)) serverOffset = serverTime - Date.now();
      const renderPosition = (position) => {
        const occupied = position.primary;
        const label = position.display_status.replace('_', ' ').toUpperCase();
        const buttons = position.display_status === 'closed'
          ? '<button class="btn" data-operation="logon">Log on</button>'
          : position.display_status === 'vacant'
            ? '<button class="btn" data-operation="logon">Log on</button><button class="btn btn-secondary" data-operation="close">Close</button>'
            : '<button class="btn" data-operation="handover">Hand over</button><button class="btn btn-secondary" data-operation="logoff">Log off</button><button class="btn btn-secondary" data-operation="logoff_close">Log off & close</button><button class="btn btn-secondary" data-operation="participant">Add secondary</button>';
        return `<article class="live-position-tile live-position-tile--${escapeText(position.display_status)}" data-position-id="${position.id}" data-position-label="${escapeText(position.code)}" data-primary-id="${occupied ? occupied.id : ''}" data-primary-name="${occupied ? escapeText(occupied.name) : ''}">
          <header><strong>${escapeText(position.code)}</strong><span>${escapeText(label)}</span></header>
          <h2>${escapeText(position.label)}</h2>
          ${occupied ? `<div class="live-position-tile__primary"><strong>${escapeText(occupied.name)}</strong><div class="live-position-controller-times"><span>Elapsed <b data-elapsed-from="${escapeText(occupied.started_at)}">00:00:00</b></span><span>Remaining <b data-remaining-from="${escapeText(occupied.started_at)}" data-maximum-seconds="${occupied.maximum_duration_seconds}">00:00:00</b></span></div></div>` : '<p>No controller logged on</p>'}
          <div class="live-position-tile__participants">${position.participants.map((p) => `<small><span><strong>${escapeText(p.role_label)}</strong> ${escapeText(p.person_name)}</span><span class="live-position-controller-times"><span>Elapsed <b data-elapsed-from="${escapeText(p.started_at)}">00:00:00</b></span><span>Remaining <b data-remaining-from="${escapeText(p.started_at)}" data-maximum-seconds="${p.maximum_duration_seconds}">00:00:00</b></span></span><button data-operation="participant_remove" data-participant-id="${p.id}">Log off</button></small>`).join('')}</div>
          <footer>${buttons}</footer>
        </article>`;
      };
      const grouped = new Map();
      payload.positions.forEach((position) => {
        const name = position.group_name || 'Other positions';
        if (!grouped.has(name)) grouped.set(name, {order: position.group_order, positions: []});
        grouped.get(name).positions.push(position);
      });
      const operationalGroupPriority = (name) => {
        const normalized = name.trim().toLowerCase();
        if (normalized.startsWith('tower')) return 0;
        if (normalized.startsWith('radar')) return 1;
        return 2;
      };
      grid.innerHTML = [...grouped.entries()]
        .sort((a, b) => operationalGroupPriority(a[0]) - operationalGroupPriority(b[0]) || a[1].order - b[1].order || a[0].localeCompare(b[0]))
        .map(([name, group]) => `<section class="live-position-group">
          <header class="live-position-group__header"><h2>${escapeText(name)}</h2><span>${group.positions.length} position${group.positions.length === 1 ? '' : 's'}</span></header>
          <div class="live-position-grid">${group.positions.map(renderPosition).join('')}</div>
        </section>`).join('') || '<p class="empty-state">No active operational positions are configured.</p>';
      connection.innerHTML = '<span aria-hidden="true">●</span> Connected';
      connection.classList.add('is-connected');
      refreshed.textContent = `Last refreshed ${new Date().toLocaleTimeString('en-GB')}`;
      fitBoard();
    };
    const loadPeople = async () => {
      const response = await fetch('{{ url_for("live_position.controllers") }}', {headers: {'Accept': 'application/json'}});
      if (!response.ok) return;
      const payload = await response.json();
      people = payload.controllers;
    };
    const populateSecondaryPeople = () => {
      const role = document.getElementById('live-position-support-role').value;
      const primaryId = Number(document.getElementById('live-position-person').value);
      const eligible = people.filter((person) => person.id !== primaryId && (
        role === 'ojti' ? person.is_ojti : role === 'assessor' ? person.is_assessor : false
      ));
      document.getElementById('live-position-support-person').innerHTML = '<option value="">Select secondary controller</option>' + eligible.map((person) => `<option value="${person.id}">${escapeText(person.name)}</option>`).join('');
      document.getElementById('live-position-support-person-wrap').hidden = !role;
      document.getElementById('live-position-support-person').required = Boolean(role);
    };
    const openAction = (button) => {
      const tile = button.closest('[data-position-id]');
      const operation = button.dataset.operation;
      document.getElementById('live-position-id').value = tile.dataset.positionId;
      document.getElementById('live-position-operation').value = operation;
      document.getElementById('live-position-participant-id').value = button.dataset.participantId || '';
      document.getElementById('live-position-dialog-title').textContent = `${button.textContent.trim()} · ${tile.dataset.positionLabel}`;
      const primarySelect = document.getElementById('live-position-person');
      primarySelect.innerHTML = '<option value="">Select your name</option>' + people.map((person) => `<option value="${person.id}">${escapeText(person.name)}</option>`).join('');
      const needsPrimary = ['logon', 'handover'].includes(operation);
      const supportsSecondary = needsPrimary || operation === 'participant';
      if (operation === 'participant' && tile.dataset.primaryId) {
        if (![...primarySelect.options].some((option) => option.value === tile.dataset.primaryId)) {
          primarySelect.add(new Option(tile.dataset.primaryName, tile.dataset.primaryId));
        }
        primarySelect.value = tile.dataset.primaryId;
      }
      document.getElementById('live-position-person-wrap').hidden = !(needsPrimary || operation === 'participant');
      primarySelect.required = needsPrimary;
      primarySelect.disabled = operation === 'participant';
      document.getElementById('live-position-support-role-wrap').hidden = !supportsSecondary;
      document.getElementById('live-position-support-role').value = operation === 'participant' ? 'ojti' : '';
      document.getElementById('live-position-support-role').required = operation === 'participant';
      document.getElementById('live-position-dialog-help').textContent = supportsSecondary ? 'Select the controller arrangement.' : 'Confirm the operational change.';
      populateSecondaryPeople();
      document.getElementById('live-position-action-error').hidden = true;
      dialog.showModal();
    };
    const openLogoffChoice = (position) => {
      logoffDialog.dataset.positionId = position.id;
      document.getElementById('live-position-logoff-help').textContent = `${position.primary.name} is the primary controller. Choose whether to log off everyone or only a secondary controller.`;
      logoffOptions.replaceChildren();
      const allButton = document.createElement('button');
      allButton.type = 'button';
      allButton.className = 'btn';
      allButton.dataset.logoffChoice = 'all';
      allButton.textContent = 'Log off all controllers';
      logoffOptions.append(allButton);
      position.participants.forEach((participant) => {
        const secondaryButton = document.createElement('button');
        secondaryButton.type = 'button';
        secondaryButton.className = 'btn btn-secondary';
        secondaryButton.dataset.logoffChoice = 'secondary';
        secondaryButton.dataset.participantId = participant.id;
        secondaryButton.textContent = `Log off ${participant.person_name} (${participant.role_label}) only`;
        logoffOptions.append(secondaryButton);
      });
      logoffError.hidden = true;
      logoffDialog.showModal();
    };
    grid.addEventListener('click', async (event) => {
      const button = event.target.closest('[data-operation]');
      if (!button) return;
      const operation = button.dataset.operation;
      if (operation === 'logoff' || operation === 'logoff_close') {
        const tile = button.closest('[data-position-id]');
        const position = livePositions.get(Number(tile.dataset.positionId));
        if (operation === 'logoff' && position?.participants.length) {
          openLogoffChoice(position);
          return;
        }
        button.disabled = true;
        try {
          const response = await fetch(`/live-positions/api/positions/${tile.dataset.positionId}/logoff`, {
            method: 'POST',
            headers: {'Content-Type': 'application/json', 'X-CSRF-Token': csrf},
            body: JSON.stringify({
              close_position: operation === 'logoff_close',
              request_key: crypto.randomUUID(),
            }),
          });
          const result = await response.json().catch(() => ({}));
          if (!response.ok) throw new Error(result.error || 'The controller could not be logged off.');
          await refresh();
        } catch (failure) {
          warning.textContent = failure.message;
          warning.hidden = false;
          button.disabled = false;
        }
        return;
      }
      openAction(button);
    });
    document.querySelector('[data-logoff-dialog-close]').addEventListener('click', () => logoffDialog.close());
    logoffOptions.addEventListener('click', async (event) => {
      const button = event.target.closest('[data-logoff-choice]');
      if (!button) return;
      const positionId = logoffDialog.dataset.positionId;
      const logoffAll = button.dataset.logoffChoice === 'all';
      const route = logoffAll
        ? `/live-positions/api/positions/${positionId}/logoff`
        : `/live-positions/api/positions/${positionId}/participants/${button.dataset.participantId}/logoff`;
      button.disabled = true;
      try {
        const response = await fetch(route, {
          method: 'POST',
          headers: {'Content-Type': 'application/json', 'X-CSRF-Token': csrf},
          body: JSON.stringify({close_position: false, request_key: crypto.randomUUID()}),
        });
        const result = await response.json().catch(() => ({}));
        if (!response.ok) throw new Error(result.error || 'The controller could not be logged off.');
        logoffDialog.close();
        await refresh();
      } catch (failure) {
        logoffError.textContent = failure.message;
        logoffError.hidden = false;
        button.disabled = false;
      }
    });
    document.querySelector('[data-dialog-close]').addEventListener('click', () => dialog.close());
    document.getElementById('live-position-support-role').addEventListener('change', populateSecondaryPeople);
    document.getElementById('live-position-person').addEventListener('change', populateSecondaryPeople);
    form.addEventListener('submit', async (event) => {
      event.preventDefault();
      const operation = document.getElementById('live-position-operation').value;
      const positionId = document.getElementById('live-position-id').value;
      const participantId = document.getElementById('live-position-participant-id').value;
      const routes = {
        open: `/live-positions/api/positions/${positionId}/open`,
        close: `/live-positions/api/positions/${positionId}/close`,
        logon: `/live-positions/api/positions/${positionId}/logon`,
        logoff: `/live-positions/api/positions/${positionId}/logoff`,
        logoff_close: `/live-positions/api/positions/${positionId}/logoff`,
        handover: `/live-positions/api/positions/${positionId}/handover`,
        participant: `/live-positions/api/positions/${positionId}/participants`,
        participant_remove: `/live-positions/api/positions/${positionId}/participants/${participantId}/logoff`,
      };
      const payload = {
        person_id: Number(document.getElementById('live-position-person').value),
        support_role: document.getElementById('live-position-support-role').value,
        support_person_id: Number(document.getElementById('live-position-support-person').value),
        close_position: operation === 'logoff_close',
        request_key: crypto.randomUUID(),
      };
      const error = document.getElementById('live-position-action-error');
      try {
        const response = await fetch(routes[operation], {
          method: 'POST', headers: {'Content-Type': 'application/json', 'X-CSRF-Token': csrf},
          body: JSON.stringify(payload),
        });
        const result = await response.json().catch(() => ({}));
        if (!response.ok) throw new Error(result.error || 'The action could not be completed.');
        dialog.close();
        form.reset();
        await refresh();
      } catch (failure) {
        error.textContent = failure.message;
        error.hidden = false;
      }
    });
    const refresh = async () => {
      try {
        const response = await fetch('{{ url_for("live_position.live_state") }}', {headers: {'Accept': 'application/json'}});
        if (!response.ok) throw new Error('refresh failed');
        render(await response.json());
      } catch (_) {
        connection.innerHTML = '<span aria-hidden="true">●</span> Reconnecting';
        connection.classList.remove('is-connected');
      }
    };
    const updateClocks = () => {
      const now = new Date(Date.now() + serverOffset);
      if (!Number.isFinite(now.getTime())) return;
      clock.textContent = now.toISOString().slice(11, 19);
      const formatDuration = (totalSeconds) => {
        const seconds = Math.max(0, Math.floor(totalSeconds));
        return `${String(Math.floor(seconds / 3600)).padStart(2, '0')}:${String(Math.floor((seconds % 3600) / 60)).padStart(2, '0')}:${String(seconds % 60).padStart(2, '0')}`;
      };
      document.querySelectorAll('[data-elapsed-from]').forEach((node) => {
        const seconds = Math.max(0, Math.floor((now - new Date(node.dataset.elapsedFrom)) / 1000));
        node.textContent = formatDuration(seconds);
      });
      document.querySelectorAll('[data-remaining-from]').forEach((node) => {
        const elapsed = Math.max(0, Math.floor((now - new Date(node.dataset.remainingFrom)) / 1000));
        const remaining = Number(node.dataset.maximumSeconds) - elapsed;
        node.textContent = remaining >= 0 ? formatDuration(remaining) : `Over ${formatDuration(-remaining)}`;
        node.classList.toggle('is-overdue', remaining < 0);
      });
    };
    updateClocks();
    setInterval(updateClocks, 1000);
    setInterval(refresh, 15000);
    const connectEvents = () => {
      if (!window.EventSource) return;
      const source = new EventSource('{{ url_for("live_position.live_events") }}');
      source.addEventListener('state', (event) => {
        try { render(JSON.parse(event.data)); } catch (_) { /* polling remains active */ }
      });
      source.onerror = () => {
        connection.innerHTML = '<span aria-hidden="true">●</span> Reconnecting';
        connection.classList.remove('is-connected');
      };
    };
    loadPeople().then(() => { refresh(); connectEvents(); });
    if ('wakeLock' in navigator) navigator.wakeLock.request('screen').catch(() => {});
  })();
  </script>
</body>
</html>
