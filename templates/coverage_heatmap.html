{% extends "base.html" %}
{% block title %}Coverage Heatmap{% endblock %}
{% block content %}
<div class="container-fluid my-4"><h2>Coverage heatmap · {{ ym }}</h2>
<div class="table-responsive"><table class="table table-bordered"><thead><tr><th>Date</th><th>M</th><th>D</th><th>A</th><th>N</th></tr></thead><tbody>
{% for day in days %}<tr><td>{{ day }}</td>{% for code in ['M','D','A','N'] %}<td class="{{ 'bg-danger' if counts[day][code] == 0 else 'bg-warning' if counts[day][code] < 2 else 'bg-success' }}">{{ counts[day][code] }}</td>{% endfor %}</tr>{% endfor %}
</tbody></table></div></div>
{% endblock %}
