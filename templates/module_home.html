{% extends "base.html" %}
{% block title %}Choose module{% endblock %}
{% block content %}
<section class="module-launcher">
  <div class="module-launcher__intro">
    <h2>{{ current_unit.name }}</h2>
    <p>Please select a module</p>
  </div>
  <div class="module-launcher__grid">
    <a class="module-card" href="{{ url_for('index') }}">
      <span class="module-card__icon module-card__icon--roster" aria-hidden="true"><i class="fa-solid fa-calendar-check"></i></span>
      <span><strong>Roster</strong></span>
      <i class="fa-solid fa-arrow-right" aria-hidden="true"></i>
    </a>
    <a class="module-card module-card--briefing" href="{{ url_for('briefing.home') }}">
      <span class="module-card__icon module-card__icon--briefing" aria-hidden="true"><i class="fa-solid fa-clipboard-list"></i></span>
      <span><strong>Briefing</strong></span>
      <i class="fa-solid fa-arrow-right" aria-hidden="true"></i>
    </a>
  </div>
</section>
{% endblock %}
