[tool.ruff]
target-version = "py312"

[tool.ruff.lint.per-file-ignores]
# Legacy monolith baseline. New modules receive the default Ruff rules.
"app.py" = ["E402", "E731", "F401", "F811", "F841"]
"scripts/build_roster_briefing_manual.py" = ["F401"]
"scripts/import_first_unit.py" = ["F401"]

[tool.pytest.ini_options]
addopts = "--strict-markers"

[tool.coverage.run]
source = ["."]
omit = [
  "tests/*",
  "migrations/*",
  "scripts/*",
  "desktop_app.py",
  "wsgi.py",
]

[tool.coverage.report]
fail_under = 60
skip_covered = true
show_missing = true
