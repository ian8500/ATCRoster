[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
# Keep the established lint baseline explicit across Ruff upgrades.
select = ["E4", "E7", "E9", "F"]

[tool.ruff.lint.per-file-ignores]
# Legacy monolith baseline. New modules receive the default Ruff rules.
"app.py" = ["E402", "E731", "F401", "F811", "F841"]
"scripts/build_roster_briefing_manual.py" = ["F401"]
"scripts/import_first_unit.py" = ["F401"]
# Several integration modules intentionally set database environment variables
# before importing the legacy application module.
"tests/*.py" = ["E402"]

[tool.pytest.ini_options]
addopts = "--strict-markers"
filterwarnings = [
  # Flask-Login 0.6.3 is the latest release and still uses utcnow when
  # calculating remember-cookie expiry. Keep all other deprecations visible.
  "ignore:datetime\\.datetime\\.utcnow\\(\\) is deprecated.*:DeprecationWarning:flask_login\\.login_manager",
]

[tool.coverage.run]
source = ["."]
omit = [
  "tests/*",
  "migrations/*",
  "scripts/*",
  "wsgi.py",
]

[tool.coverage.report]
fail_under = 60
skip_covered = true
show_missing = true
