name: Quality

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: pip install -r requirements-dev.txt
      - name: Formatting, lint and static analysis
        run: |
          git ls-files -z '*.py' | xargs -0 ruff check
          mypy --ignore-missing-imports --follow-imports=skip atcroster production_operations.py rate_limiting.py signup_locking.py
      - run: pip-audit -r requirements-prod.txt
      - name: Full maintained-application security scan
        run: bandit -q -ll -s B101 -r . -x ./tests,./migrations,./instance
      - name: Compile every Python source file
        run: python -m compileall -q -x '(/instance/|/.git/)' .
      - run: python -m pytest --cov --cov-report=term-missing -q
      - name: Release-candidate facts
        run: python scripts/verify_release_candidate.py
      - name: Verify fresh split migrations
        run: |
          control_db="$(mktemp -u).db"
          operational_db="$(mktemp -u).db"
          combined_db="$(mktemp -u).db"
          ATCROSTER_SCHEMA_ROLE=control DATABASE_URL="sqlite:///$control_db" alembic upgrade head
          ATCROSTER_SCHEMA_ROLE=operational DATABASE_URL="sqlite:///$operational_db" alembic upgrade head
          ATCROSTER_SCHEMA_ROLE=combined DATABASE_URL="sqlite:///$combined_db" alembic upgrade head

  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
      - uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          push: false
          tags: atcroster:test
          load: true
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: atcroster:test
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
      - name: Generate CycloneDX SBOM
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: atcroster:test
          format: cyclonedx
          output: sbom.cdx.json
      - name: Upload SBOM
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: atcroster-sbom-${{ github.sha }}
          path: sbom.cdx.json
          if-no-files-found: error

  postgres-multidatabase:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: atcroster
          POSTGRES_PASSWORD: integration-only
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U atcroster"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      FLASK_SECRET_KEY: integration-only-secret-with-at-least-32-characters
      ATCROSTER_SKIP_RUNTIME_SCHEMA: "1"
      ATCROSTER_TEST_CONTROL_DATABASE_URL: postgresql+psycopg://atcroster:integration-only@127.0.0.1:5432/atcroster_control
      ATCROSTER_TEST_A_DATABASE_URL: postgresql+psycopg://atcroster:integration-only@127.0.0.1:5432/atcroster_airport_a
      ATCROSTER_TEST_B_DATABASE_URL: postgresql+psycopg://atcroster:integration-only@127.0.0.1:5432/atcroster_airport_b
      ATCROSTER_TEST_RESTORE_DATABASE_URL: postgresql+psycopg://atcroster:integration-only@127.0.0.1:5432/atcroster_restore
      REDIS_URL: redis://127.0.0.1:6379/0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - name: Create isolated integration databases
        run: |
          python - <<'PY'
          import psycopg
          connection = psycopg.connect(
              "postgresql://atcroster:integration-only@127.0.0.1:5432/postgres",
              autocommit=True,
          )
          for name in (
              "atcroster_control",
              "atcroster_airport_a",
              "atcroster_airport_b",
              "atcroster_restore",
          ):
              connection.execute(f'CREATE DATABASE "{name}"')
          connection.close()
          PY
      - run: python -m pytest -q tests/test_postgresql_multidatabase.py tests/test_redis_integration.py

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
