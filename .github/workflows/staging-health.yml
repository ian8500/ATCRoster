name: Staging health

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: staging-health
  cancel-in-progress: true

jobs:
  health:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Check liveness and readiness
        env:
          STAGING_ORIGIN: https://pilot.atcroster.com
        run: |
          set -euo pipefail
          curl --fail --show-error --silent \
            --retry 3 --retry-all-errors --retry-delay 5 \
            --max-time 15 \
            "$STAGING_ORIGIN/health/live" |
            jq -e '.status == "ok" and .environment == "staging"'
          curl --fail --show-error --silent \
            --retry 3 --retry-all-errors --retry-delay 5 \
            --max-time 15 \
            "$STAGING_ORIGIN/health/ready" |
            jq -e '.status == "ready"'
